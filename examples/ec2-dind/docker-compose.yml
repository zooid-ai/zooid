# budd Podman demo — single EC2 host, no inner Docker daemon.
#
# Uses PodmanRuntime: each session spawns an agent container via `podman run`
# directly inside the budd container. No --privileged needed.
#
# Required host setup (Ubuntu 24.04):
#   security_opt seccomp+apparmor:unconfined  — allow clone/mount syscalls
#   cap_add NET_ADMIN + SYS_ADMIN             — network/mount namespace creation
#
# Setup:
#   1. Copy .env.example → .env and fill in the values.
#   2. docker compose up -d
#   3. curl -N http://localhost:8080/agents/code/sessions \
#        -H "Authorization: Bearer $BUDD_TOKEN" \
#        -H "Content-Type: application/json" \
#        -d '{"prompt":"what files are in /workspace?"}'

services:
  budd:
    image: ghcr.io/zooid-ai/budd-runtime-podman:latest
    container_name: budd
    ports:
      - "8080:8080"
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    environment:
      BUDD_TOKEN: ${BUDD_TOKEN:?set BUDD_TOKEN in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
    volumes:
      - ./workspace:/workspace
    restart: unless-stopped
