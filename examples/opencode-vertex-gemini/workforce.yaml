# opencode + Vertex Gemini 3.1 Pro — docker + matrix smoke.
#
# Boots a Tuwunel-backed Matrix homeserver (via `zooid dev`), connects the
# zooid daemon as an Application Service, and spawns the reviewer agent in
# a docker container built from the sibling Dockerfile. Mention
# @reviewer:localhost in the #review room to drive a turn.

runtime: docker

transports:
  matrix:
    type: matrix
    homeserver: http://localhost:8448
    as_token: ${MATRIX_AS_TOKEN}
    hs_token: ${MATRIX_HS_TOKEN}
    sender_localpart: zooid
    user_namespace: '@.*:localhost'
    port: 9099

agents:
  reviewer:
    workdir: /workspace
    acp:
      preset: opencode
    container:
      image: zooid-opencode-vertex:smoke
      env:
        GOOGLE_VERTEX_API_KEY: ${GOOGLE_VERTEX_API_KEY}
    matrix:
      transport: matrix
      user_id: '@reviewer:localhost'
      rooms:
        - '#review:localhost'
      trigger: mention
