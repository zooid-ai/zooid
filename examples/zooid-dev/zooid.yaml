# Local-dev workforce for `zooid dev`. Run from this directory:
#   pnpm zooid dev
#
# This boots Tuwunel + the daemon + the bundled @zoon/web UI in one foreground
# process, registers an `admin:admin` Matrix user, and joins the agents to
# their #welcome / per-agent rooms.
#
#   - @echo:localhost — a tiny ACP shim that just echoes your text. No deps.
#   - @docs:localhost — opencode-driven docs agent that keeps
#     agents/docs/code/README.md in sync with the throttle source. Requires
#     `opencode` on PATH and a Vertex Express API key in the environment.
#
# Identifiers can use a short form (`@echo`, `#welcome`) — the daemon expands
# them against the matrix transport's server_name. `display_name` (optional)
# sets the agent's profile name; absent, the localpart is used.
#
# @-mention either bot in #welcome to drive a turn.

runtime: local

transports:
  matrix:
    type: matrix
    homeserver: http://localhost:8448
    as_token: ${MATRIX_AS_TOKEN}
    hs_token: ${MATRIX_HS_TOKEN}
    sender_localpart: zooid
    user_namespace: '@.*:localhost'
    port: 9099
    # Workforce space localpart. Resolves to alias #<space>:<server_name>.
    # Defaults to `dev` when omitted.
    # space: dev

agents:
  echo:
    workdir: ./agents/echo
    acp:
      command: node
      args: ['--import', 'tsx', './echo-agent.ts']
    matrix:
      transport: matrix
      user_id: '@echo'
      rooms:
        - '#welcome'
      trigger: mention

  docs:
    workdir: ./agents/docs
    acp:
      preset: opencode
    matrix:
      transport: matrix
      user_id: '@docs-agent'
      display_name: 'Docs Agent'
      rooms:
        - '#docs'
      trigger: mention

  ux-consultant:
    workdir: ./agents/ux-consultant
    acp:
      preset: opencode
    matrix:
      transport: matrix
      user_id: '@ux-consultant'
      rooms:
        - '#product'
      trigger: mention
