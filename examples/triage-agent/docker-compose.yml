# Triage agent — local docker compose for end-to-end testing.
#
# Usage (from this directory):
#
#   1. Put your secrets in .env (gitignored):
#        ANTHROPIC_API_KEY=sk-ant-...
#        ZOOID_TOKEN=$(openssl rand -hex 32)
#
#   2. Bring it up:
#        docker compose up --build
#
#   3. From another terminal, start a session (long-lived SSE stream):
#        curl -N http://localhost:8080/agents/default/sessions \
#          -H "Authorization: Bearer $ZOOID_TOKEN" \
#          -H "Content-Type: application/json" \
#          -d '{"prompt":"the get started button on the homepage is too small"}'
#
#   4. As approval.request frames arrive, decide them via HTTP:
#        curl -X POST \
#          http://localhost:8080/agents/default/sessions/<sid>/approvals/<approval_id> \
#          -H "Authorization: Bearer $ZOOID_TOKEN" \
#          -H "Content-Type: application/json" \
#          -d '{"decision":"allow","option_id":"allow-once"}'
#
#   5. When turn.end fires, check ./tickets/ for the result.
#
# The image is the single zooid-agent-base — no per-CLI Dockerfile baked
# in. The Claude Code ACP shim is fetched on first run via `npx -y` inside
# the container. Build context is the runtime-docker package's docker/
# directory so the build is fast and self-contained.

services:
  triage-agent:
    build:
      context: ../../packages/runtime-docker/docker/agent-base
      dockerfile: Dockerfile
    image: ghcr.io/zooid-ai/zooid-agent-base:local
    container_name: zooid-triage
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      ZOOID_TOKEN: ${ZOOID_TOKEN:?set ZOOID_TOKEN in .env (e.g. openssl rand -hex 32)}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
    volumes:
      # Mount the entire zooid repo so the agent can read ../../packages/.
      - ../..:/workspace
    working_dir: /workspace/examples/triage-agent
