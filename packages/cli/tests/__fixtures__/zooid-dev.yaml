# Local-dev workforce for `zooid dev`. Run from this directory:
#   pnpm zooid dev
#
# Boots Tuwunel + the daemon + the bundled @zoon/web UI in one foreground
# process, registers an `admin:admin` Matrix user, and joins the agents to
# their #welcome / per-agent rooms.
#
# Inferred defaults (override any field by writing it explicitly — see
# epics/020-ZOD048-yaml-defaults/SPEC.md):
#   - workdir          ./agents/<name>
#   - matrix.transport the unique matrix transport ("matrix" below)
#   - matrix.user_id   @<agent_key>:<server_name>
#   - rooms[]          server_name appended automatically (#welcome → #welcome:localhost)
#   - transports.matrix.type             from the key "matrix"
#   - transports.matrix.sender_localpart "zooid"
#   - transports.matrix.user_namespace   derived from homeserver hostname
#   - transports.matrix.as_token         ${MATRIX_AS_TOKEN}
#   - transports.matrix.hs_token         ${MATRIX_HS_TOKEN}
#
# Required env vars: MATRIX_AS_TOKEN, MATRIX_HS_TOKEN.
#
# Bots:
#   - @echo:localhost — tiny ACP shim that echoes your text. No deps.
#   - @docs:localhost — opencode-driven docs agent (requires `opencode` on PATH).
#   - @ux-consultant:localhost — opencode-driven UX consultant.
#
# @-mention either bot in #welcome to drive a turn.

runtime: local

transports:
  matrix:
    homeserver: http://localhost:8448
    port: 9099

agents:
  echo:
    acp:
      command: node
      args: ['--import', 'tsx', './echo-agent.ts']
    matrix:
      rooms: ['#welcome']

  docs:
    acp: { preset: opencode }
    matrix:
      display_name: 'Docs Agent'
      rooms: ['#docs']

  ux-consultant:
    acp: { preset: opencode }
    matrix:
      rooms: ['#ux-consultant']
