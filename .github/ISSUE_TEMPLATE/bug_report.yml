name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps so a maintainer can hit the same bug.
      placeholder: |
        1. Run `zooid dev`
        2. Open a room, mention an agent
        3. Leave the tab idle for 10+ minutes
        4. Send another message
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, `zooid` version (`zooid --version`), browser (if web client), transport (Matrix/HTTP).
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / console output
      description: Daemon logs, browser devtools console, or `zooid tuwunel:errors` output. Paste as text, not a screenshot.
      render: shell
    validations:
      required: false
