name: Publish budd images

on:
  push:
    tags:
      - 'budd-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 0.3.0) or "latest"'
        required: true
        default: 'latest'

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#budd-v}" >> "$GITHUB_OUTPUT"
          fi

  agent-claude-code:
    runs-on: ubuntu-latest
    needs: resolve-version
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push budd-agent-claude-code
        uses: docker/build-push-action@v6
        with:
          context: packages/runtime-docker/docker/claude-agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/zooid-ai/budd-agent-claude-code:${{ needs.resolve-version.outputs.version }}
            ghcr.io/zooid-ai/budd-agent-claude-code:latest

  runtime-dind:
    runs-on: ubuntu-latest
    needs: resolve-version
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure images directory exists (Dockerfile.local needs it)
        run: mkdir -p images

      - name: Build and push budd-runtime-dind
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/runtime-docker/docker/dind/Dockerfile.local
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/zooid-ai/budd-runtime-dind:${{ needs.resolve-version.outputs.version }}
            ghcr.io/zooid-ai/budd-runtime-dind:latest
