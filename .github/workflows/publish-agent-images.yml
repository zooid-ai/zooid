name: Publish agent images

on:
  push:
    branches: [main]
    paths:
      - 'packages/runtime-docker/docker/**'
    tags:
      - 'agent-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 0.3.0) or "latest"'
        required: true
        default: 'latest'

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#agent-v}" >> "$GITHUB_OUTPUT"
          else
            # Branch push (a merged bump): refresh :latest only.
            echo "version=latest" >> "$GITHUB_OUTPUT"
          fi

  agent-base:
    runs-on: ubuntu-latest
    needs: resolve-version
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push agent-base
        uses: docker/build-push-action@v6
        with:
          context: packages/runtime-docker/docker/agent-base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/zooid-ai/agent-base:${{ needs.resolve-version.outputs.version }}
            ghcr.io/zooid-ai/agent-base:latest

  agent-claude-code:
    runs-on: ubuntu-latest
    needs: [resolve-version, agent-base]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push agent-claude-code
        uses: docker/build-push-action@v6
        with:
          context: packages/runtime-docker/docker/agent-claude-code
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/zooid-ai/agent-claude-code:${{ needs.resolve-version.outputs.version }}
            ghcr.io/zooid-ai/agent-claude-code:latest

  agent-codex:
    runs-on: ubuntu-latest
    needs: [resolve-version, agent-base]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push agent-codex
        uses: docker/build-push-action@v6
        with:
          context: packages/runtime-docker/docker/agent-codex
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/zooid-ai/agent-codex:${{ needs.resolve-version.outputs.version }}
            ghcr.io/zooid-ai/agent-codex:latest

  agent-opencode:
    runs-on: ubuntu-latest
    needs: [resolve-version, agent-base]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push agent-opencode
        uses: docker/build-push-action@v6
        with:
          context: packages/runtime-docker/docker/agent-opencode
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/zooid-ai/agent-opencode:${{ needs.resolve-version.outputs.version }}
            ghcr.io/zooid-ai/agent-opencode:latest

  agent-pi:
    runs-on: ubuntu-latest
    needs: [resolve-version, agent-base]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push agent-pi
        uses: docker/build-push-action@v6
        with:
          context: packages/runtime-docker/docker/agent-pi
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/zooid-ai/agent-pi:${{ needs.resolve-version.outputs.version }}
            ghcr.io/zooid-ai/agent-pi:latest
