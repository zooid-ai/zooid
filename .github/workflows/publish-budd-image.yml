name: Publish budd image

on:
  push:
    tags:
      - 'budd-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'budd version to bake into the image (npm dist-tag or version)'
        required: true
        default: 'latest'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#budd-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: packages/runtime-docker/docker/claude
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUDD_VERSION=${{ steps.version.outputs.version }}
          tags: |
            budd/claude-code:${{ steps.version.outputs.version }}
            budd/claude-code:latest
