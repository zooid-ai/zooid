name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly leg for the infra tier (ZOD098 § 7): more samples of a flaky suite.
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR). The
# nightly run gets its own group so it never cancels, or is cancelled by, a
# push to main.
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: true

jobs:
  build-test:
    # The nightly run is for the infra tier only.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Unit tests only. Integration suites (any *integration* file or
      # integration/ dir) are excluded — several need a running Tuwunel
      # homeserver / Docker and flake on hosted runners. Run those locally
      # (pnpm test) or in a dedicated infra job.
      - name: Test
        run: pnpm test:ci

      # Tier 2 (ZOD098): Docker-free suites that need only the build output
      # above and a Unix socket. Each package lists its own suites by path in a
      # test:socket script; a skipped or empty selection fails the step. To add
      # a suite, give its package a test:socket script. The filename does not
      # matter.
      - name: Socket tier tests
        run: pnpm test:socket

  # Tier 3 (ZOD098 § 7): suites that need Docker and Tuwunel. Each package
  # lists its suites by path in a test:infra script; a skip fails the job.
  # A required check with a single attempt: no retry, no continue-on-error. A
  # failure may be a finding (typing-lease → zooid-ai/zooid#36), not a test to
  # relax.
  test-infra:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Before anything else: without a daemon every suite would only skip.
      - name: Docker preflight
        run: |
          docker info > /dev/null || {
            echo "::error title=No Docker::the infra tier needs a working Docker daemon"
            exit 1
          }

      # Image pulls would otherwise eat the suites' 60s health-check budgets.
      - name: Pre-pull images
        run: |
          docker pull ghcr.io/matrix-construct/tuwunel:latest
          docker pull alpine:3

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Infra tier tests
        run: pnpm test:infra
